name: Build and Release

on:
  push:
    branches:
      - develop
    paths:
      - 'package.json'
      - '.github/workflows/build-release.yml'
      - 'python-backend/python_backend.spec'
      - 'scripts/prepare-release-python.cjs'
      - 'scripts/release-upstream.json'
      - 'scripts/windows-installer/**'
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release Preflight
    if: github.ref_type == 'tag'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify release tag and source version
        run: node scripts/release-version.cjs

      - name: Require stable source on main
        if: ${{ !contains(github.ref_name, '-') }}
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main

      - name: Prepare pinned release Python
        run: node scripts/prepare-release-python.cjs

      - name: Install Node dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run JS/TS tests
        run: npm test

      - name: Install Python dependencies
        run: |
          cd python-backend
          python -m pip install -r requirements.txt
        shell: bash

      - name: Run mypy
        run: |
          cd python-backend
          python -m mypy --config-file mypy.ini main.py pdf_processor.py request_context.py diagnostics.py paddle_http.py build_info.py build_backend.py windows_lifecycle.py
        shell: bash

      - name: Run Python tests
        run: |
          cd python-backend
          python -m pytest
        shell: bash

      - name: Install Tesseract for source OCR workflow
        run: brew install tesseract

      - name: Verify generated application icons
        run: python scripts/generate-icons.py --check
        shell: bash

      - name: Prepare pinned OCR languages for source workflow
        run: node scripts/prepare-ocr-languages.cjs

      - name: Source Main workflow
        run: npm run test:e2e
        env:
          PDF_TESSDATA_DIR: ${{ github.workspace }}/.project-state/ocr-data

  build:
    needs: preflight
    if: ${{ !cancelled() && (needs.preflight.result == 'success' || (github.ref == 'refs/heads/develop' && needs.preflight.result == 'skipped')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-2022

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Bind package evidence to the exact repository bytes on both platforms.
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      PDF_REQUIRE_RELEASE_RUNTIME: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare pinned release Python
        run: node scripts/prepare-release-python.cjs

      - name: Install Tesseract OCR (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install tesseract tesseract-lang
        shell: bash

      - name: Verify Tesseract Installation (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          tesseract --version
        shell: bash

      - name: Install pinned Python dependencies
        run: |
          cd python-backend
          python -m pip install -r requirements.txt
        shell: bash

      - name: Verify release tag and source version
        if: github.ref_type == 'tag'
        run: node scripts/release-version.cjs

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare pinned Windows Tesseract
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          executable="$(node scripts/prepare-windows-ocr.cjs)"
          printf 'PDF_TESSERACT_PATH=%s\n' "$executable" >> "$GITHUB_ENV"
          node -p 'require("node:path").dirname(process.argv[1])' "$executable" >> "$GITHUB_PATH"

      - name: Prepare pinned OCR languages
        run: node scripts/prepare-ocr-languages.cjs
        shell: bash

      - name: Build isolated E2E package
        run: npm run package -- --test-inspect
        shell: bash
        env:
          PDF_TESSDATA_DIR: ${{ github.workspace }}/.project-state/ocr-data

      - name: Verify packaged Main and frozen backend workflow
        run: npm run test:e2e:packaged
        shell: bash
        env:
          PDF_TESSDATA_DIR: ${{ github.workspace }}/.project-state/ocr-data

      - name: Build Electron app with electron-forge
        run: npm run make
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_ENABLE_NODE_CLI_INSPECT_ARGUMENTS: 'false'
          PDF_TESSDATA_DIR: ${{ github.workspace }}/.project-state/ocr-data

      - name: Verify manual-install Mac release integrity
        if: runner.os == 'macOS'
        run: node scripts/verify-mac-release.cjs --manual
        shell: bash

      - name: Verify Windows installer contents and project icons
        if: runner.os == 'Windows'
        run: node scripts/verify-windows-release.cjs
        shell: bash

      - name: Upload build and E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-evidence-${{ matrix.os }}
          path: |
            out/*/build-evidence.json
            .project-state/e2e/packages/*/build-evidence.json
            .project-state/e2e/runs/run-*/*.json
            .project-state/e2e/runs/run-*/*.log
            .project-state/e2e/runs/run-*/failure-*.png
            .project-state/backend-builds/latest.json
            .project-state/backend-builds/run-*/self-check-*.txt
            .project-state/windows-installer/evidence/*.json
          include-hidden-files: true

      - name: Stage macOS installer for joint release
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_type == 'tag' && 'release-installers-macOS' || 'candidate-installers-macOS' }}
          path: out/make/**/*.dmg
          if-no-files-found: error

      - name: Stage Windows installer for joint release
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_type == 'tag' && 'release-installers-Windows' || 'candidate-installers-Windows' }}
          path: out/make/squirrel.windows/x64/*Setup.exe
          if-no-files-found: error

  draft_release:
    name: Prepare a joint draft release
    if: ${{ github.ref_type == 'tag' && vars.REDACTERA_RELEASE_ASSET_SOURCE != 'local' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download verified macOS installer
        uses: actions/download-artifact@v4
        with:
          name: release-installers-macOS
          path: release-input/macOS
      - name: Download verified Windows installer
        uses: actions/download-artifact@v4
        with:
          name: release-installers-Windows
          path: release-input/Windows
      - name: Download pinned upstream source archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-input/upstream
          jq -r '.archives[] | [.name, .url] | @tsv' scripts/release-upstream.json |
            while IFS=$'\t' read -r name url; do
              curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 --max-time 180 \
                --output "release-input/upstream/$name" "$url"
            done
      - name: Require both installers and archive the tagged source
        run: node scripts/prepare-release-assets.cjs release-input release-ready
      - name: Prepare joint release notes
        shell: bash
        run: |
          {
            printf 'Source commit `%s`.\n\n' "$(git rev-parse HEAD)"
            cat docs/release-notes/release.md
          } > release-ready/RELEASE_NOTES.md
      - name: Create draft with both installers
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-version.cjs
          flags=(--verify-tag --draft)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" \
            --title "Redactera ${GITHUB_REF_NAME#v}" --notes-file release-ready/RELEASE_NOTES.md \
            release-ready/*.dmg release-ready/*Setup.exe release-ready/*.tar.gz release-ready/*.tar.xz release-ready/SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
