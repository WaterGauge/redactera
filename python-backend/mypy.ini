[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True

[mypy-pytesseract]
ignore_missing_imports = True

[mypy-requests]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True

[mypy-fontTools.*]
ignore_missing_imports = True

# PyInstaller exposes no typing stubs; the actual archive API is checked at build time.
[mypy-pefile]
ignore_missing_imports = True

[mypy-PyInstaller.archive.readers]
ignore_missing_imports = True
